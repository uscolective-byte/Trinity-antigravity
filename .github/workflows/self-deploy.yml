name: Trinity self-deploy

on:
  push:
    branches: [main]
    paths:
      - 'Trinity/**'
      - '.github/workflows/self-deploy.yml'
  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Deploy to production after the development health check'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: trinity-self-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Trinity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Trinity/package-lock.json
      - run: npm ci
      - run: npm test

  deploy-development:
    needs: verify
    if: ${{ secrets.CF_API_TOKEN != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Trinity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Trinity/package-lock.json
      - run: npm ci
      - name: Deploy development Worker
        run: npx wrangler deploy --env development
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
      - name: Verify development readiness
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error https://auru.dev/ready; then exit 0; fi
            sleep 10
          done
          echo "Development Worker did not become ready; production deploy blocked."
          exit 1

  deploy-production:
    needs: [verify, deploy-development]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_production == true && secrets.CF_API_TOKEN != '' }}
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: Trinity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Trinity/package-lock.json
      - run: npm ci
      - name: Deploy production Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
      - name: Verify production readiness
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error https://auru.space/ready; then exit 0; fi
            sleep 10
          done
          echo "Production health check failed. Roll back to the previous known-good deployment."
          exit 1
