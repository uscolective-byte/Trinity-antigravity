name: Trinity self-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Explicitly deploy the reviewed main commit to production'
        type: boolean
        required: true
        default: false
      expected_commit_sha:
        description: 'Exact reviewed 40-character main commit SHA'
        type: string
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: trinity-self-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Trinity
    steps:
      - name: Require authorized repository and main branch
        working-directory: .
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          if [ "$SOURCE_REPOSITORY" != 'uscolective-byte/Trinity-antigravity' ] || [ "$SOURCE_REF" != 'refs/heads/main' ]; then
            echo '::error::Deployments must run from an authorized canonical repository on main.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Trinity/package-lock.json
      - name: Install TAP contracts dependencies
        working-directory: packages/contracts
        run: npm ci --ignore-scripts
      - name: Install crypto-core dependencies
        working-directory: packages/crypto-core
        run: npm ci --ignore-scripts || npm ci --legacy-peer-deps --ignore-scripts

      - run: npm ci

      - name: Check synchronized release documentation
        working-directory: .
        run: npm run docs:check
      - name: Run Sovereign Lock, Truth Guard & P0/P1 Security Audit Suite
        run: node --test tests/sovereign-lock.test.mjs tests/agent-sandbox-security.test.mjs tests/code-interpreter-security.test.mjs tests/truth-ten-commandments.test.mjs tests/omni-core-500-registry.test.mjs tests/prislub-integrity.test.mjs tests/omni-core-v11-2.test.mjs
      - name: Verify Secrets Store metadata and single-production configuration
        working-directory: .
        run: |
          node Trinity/scripts/secrets-store-doctor.mjs
          node Trinity/scripts/cloudflare-env-audit.mjs --strict
      - name: Run full build (dry-run) and unit test suite
        run: npm test

  deploy-production:
    needs: [verify]
    # Never deploy production on a push. A manual owner dispatch and exact SHA are required.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_production == true }}
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency:
      group: deployment-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: Trinity
    steps:
      - name: Enforce authenticated owner approval for this exact commit
        working-directory: .
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] ||
             [ "$GITHUB_ACTOR" != "uscolective-byte" ] ||
             [ "$GITHUB_REPOSITORY" != "uscolective-byte/Trinity-antigravity" ] ||
             [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Production requires manual dispatch from the canonical owner on main."
            exit 1
          fi
          if ! [[ "$EXPECTED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             [ "$EXPECTED_COMMIT_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Approved commit SHA does not match the exact main commit."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Trinity/package-lock.json
      - name: Install TAP contracts dependencies
        working-directory: packages/contracts
        run: npm ci --ignore-scripts
      - run: npm ci
      - name: Check deployment credentials
        id: credentials
        env:
          CF_TOKEN_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_TOKEN_FALLBACK: ${{ secrets.CF_API_TOKEN }}
          CF_ACCT_PRIMARY: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCT_FALLBACK: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          TOKEN="${CF_TOKEN_PRIMARY:-$CF_TOKEN_FALLBACK}"
          ACCT="${CF_ACCT_PRIMARY:-${CF_ACCT_FALLBACK:-b60342e5e52f5646fbd4e913bb409334}}"
          if [ -n "$TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "account_id=$ACCT" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::error::Cloudflare production credentials missing; refusing to claim successful deployment."
            exit 1
          fi
      - name: Record Git diff SHA-256 for audit (not authorization)
        env:
          GITHUB_ACTOR_NAME: ${{ github.actor }}
          GIT_COMMIT_SHA: ${{ github.sha }}
        run: |
          DIFF_HASH=$(git diff HEAD~1 HEAD | sha256sum | awk '{print $1}')
          echo "Verified Git Diff SHA-256: $DIFF_HASH for commit $GIT_COMMIT_SHA by $GITHUB_ACTOR_NAME"
          echo "DIFF_HASH=$DIFF_HASH" >> "$GITHUB_ENV"
      - name: Check production D1 migration status (read-only, fail if pending)
        if: ${{ steps.credentials.outputs.available == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.credentials.outputs.account_id }}
        run: |
          node scripts/compatible-migrations.mjs --remote --check > "$RUNNER_TEMP/trinity-d1-plan.json"
          node -e '
            const fs = require("node:fs");
            const plan = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/trinity-d1-plan.json", "utf8"));
            if (!plan.verified_complete || !Array.isArray(plan.pending) || plan.pending.length) {
              console.error("Unapplied migrations require a separate backup, owner approval and verification.");
              process.exit(1);
            }
            console.log("D1 migration state verified; no pending changes.");
          '
      - name: Deploy production Worker (trinity -> auru.space)
        if: ${{ steps.credentials.outputs.available == 'true' }}
        run: npm run deploy -- --tag "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.credentials.outputs.account_id }}
      - name: Verify production readiness (https://auru.space)
        if: ${{ steps.credentials.outputs.available == 'true' }}
        env:
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID || secrets.CF_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET || secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          node scripts/verify-deployment.mjs https://auru.space "$GITHUB_SHA"
      - name: Emit verified DEPLOYMENT_RECEIPT.json artifact
        working-directory: .
        run: |
          node -e "
            const fs = require('fs');
            const receipt = {
              schema: 'TRINITY_SOVEREIGN_DEPLOYMENT_RECEIPT_V3',
              commit_sha: process.env.GITHUB_SHA,
              git_diff_sha256: process.env.DIFF_HASH,
              actor: process.env.GITHUB_ACTOR,
              production_url: 'https://auru.space',
              exit_code: 0,
              verified_at: new Date().toISOString()
            };
            fs.writeFileSync('DEPLOYMENT_RECEIPT_CI.json', JSON.stringify(receipt, null, 2));
          "
      - uses: actions/upload-artifact@v4
        with:
          name: trinity-deployment-receipt-${{ github.sha }}
          path: DEPLOYMENT_RECEIPT_CI.json
