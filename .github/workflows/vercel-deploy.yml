name: Vercel Deploy

on:
  push:
    branches: [main]
    paths:
      - 'vercel.json'
      - 'Trinity/public/**'
      - '.github/workflows/vercel-deploy.yml'
  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Manually approve production Vercel deployment'
        type: boolean
        required: true
        default: false
      expected_commit_sha:
        description: 'Exact reviewed 40-character main commit SHA'
        type: string
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: trinity-vercel-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate vercel.json and static bridge assets
        run: |
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("vercel.json", "utf8"));
            if (!cfg.outputDirectory || !fs.existsSync(cfg.outputDirectory)) {
              throw new Error("Missing Vercel outputDirectory: " + cfg.outputDirectory);
            }
            if (!fs.existsSync(cfg.outputDirectory + "/index.html")) {
              throw new Error("Missing index.html in " + cfg.outputDirectory);
            }
            if (!Array.isArray(cfg.rewrites) || !cfg.rewrites.some(r => r.source === "/api/:path*")) {
              throw new Error("vercel.json must rewrite /api/:path* to Trinity API");
            }
            console.log("vercel.json validated:", cfg.name, "->", cfg.outputDirectory, "(" + cfg.rewrites.length + " rewrites)");
          '

  deploy-production:
    needs: [validate]
    # Pushes only validate. Production requires a separate authenticated manual dispatch.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_production == true }}
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Require canonical owner approval and exact main commit
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] ||
             [ "$GITHUB_ACTOR" != "uscolective-byte" ] ||
             [ "$GITHUB_REPOSITORY" != "uscolective-byte/Trinity-antigravity" ] ||
             [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Only a manual dispatch by the canonical owner on main may deploy Vercel production."
            exit 1
          fi
          if ! [[ "$EXPECTED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             [ "$EXPECTED_COMMIT_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Approved SHA must match the exact main commit."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require deployment credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Vercel credentials are incomplete; refusing to report a deployment."
            exit 1
          fi
      - name: Deploy to Vercel Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          DEPLOY_URL=$(npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Vercel production deployment command completed: $DEPLOY_URL"
