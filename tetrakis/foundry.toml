[profile.default]
src = "contracts"
out = "out"
script = "script"
test = "test"
libs = ["lib"]

remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/"
]

optimizer = true
optimizer_runs = 200

[profile.default.fuzz]
runs = 256

# Base mainnet
[profile.base]
etherscan_api_key = "${BASESCAN_API_KEY}"

# Base Sepolia (testnet)
[profile.sepolia]
etherscan_api_key = "${BASESCAN_API_KEY}"
